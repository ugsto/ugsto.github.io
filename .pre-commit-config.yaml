repos:
  # Standard Pre-Commit Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict

  # Prettier - Markdown, JSON, YAML Formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [markdown, json, yaml]

  # Markdown Linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: ['--config', '.markdownlint.json']

  # HTML & Zola / Tera Template Linter & Formatter (djLint)
  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-jinja
        types: [html]
      - id: djlint-jinja
        types: [html]

  # Zola Site Build Check
  - repo: local
    hooks:
      - id: zola-check
        name: zola check & build
        entry: bash -c "zola check && zola build"
        language: system
        files: '\.(md|html|toml)$'
        pass_filenames: false
