repos:
  # Standard Pre-Commit Checks (Pure Python - 100% NixOS Compatible)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict

  # HTML & Zola / Tera Template Linter (Pure Python - 100% NixOS Compatible)
  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-jinja
        files: '\.html$'
        types_or: [html, text]
      - id: djlint-jinja
        files: '\.html$'
        types_or: [html, text]

  # Zola Site Build Check (System Binary - 100% NixOS Compatible)
  - repo: local
    hooks:
      - id: zola-check
        name: zola check & build
        entry: bash -c "zola check && zola build"
        language: system
        files: '\.(md|html|toml)$'
        pass_filenames: false
