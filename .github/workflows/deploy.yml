name: CI/CD Pipeline & GitHub Pages Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint-and-check:
    name: Pre-commit Linters & Zola Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zola (Latest Stable)
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # - name: Run Pre-commit Hooks (Markdown, HTML & Syntax Linters)
      #   uses: pre-commit/action@v3.0.1

      # - name: Check Zola Site Links & Configuration
      #   run: zola check

  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    needs: lint-and-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zola (Latest Stable)
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Build Production Site with Zola
        run: zola build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
